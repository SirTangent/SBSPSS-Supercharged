name: Build & test (release)

# Every job the port has, in two profiles:
#
#   release  the full set, started by hand before a release: the Actions
#            tab (Run workflow, pick the branch) or `gh workflow run
#            build.yml --ref <branch>`.  Eleven jobs: USA and EUR data, the
#            MinGW debug/final and eur-debug/eur-final legs, the three
#            clang-cl legs, the PlayStation link.
#   pr       what pr.yml calls on every pull request into SBSP-Win11: five
#            jobs - lfs, USA data, MinGW debug (asserts on), clang-cl x64
#            FINAL (the sbsp64.exe port/package.py --x64 ships: 64-bit,
#            asserts out, the other toolchain) and the PlayStation link.
#            EUR, MinGW final and the clang-cl debug legs wait for a
#            release run.
#
# One file for both so the two cannot drift apart (the YAML anchors below
# only reach within a file).  Pushes trigger nothing.  A run costs LFS
# bandwidth (the 133MB Track1.Ixa on a cold cache, see the lfs job) and
# runner time.  A pull request's run can restore its base branch's cache,
# so a release run on SBSP-Win11 spares each new pull request that fetch.
#
# EUR (issue #42): its own data job and PC legs, data-eur and pc-eur, which
# reuse the USA jobs' steps through YAML anchors (&data-steps, &pc-steps)
# so the two territories cannot drift apart.  They are separate jobs, not
# matrix legs of data / pc-build-test, because `needs` waits for every leg:
# an EUR failure must not hold up the USA jobs, nor the reverse.  Both data
# jobs need only the lfs job, which fetches the LFS objects into the cache
# once for both.  The EUR data failure #42
# was filed for was Git Bash's native make cutting the parkgrab command
# line short, which build/globals.mak now refuses (PR #87); the runner
# uses MSYS2's make.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Which jobs to run
        type: choice
        options: [release, pr]
        default: release
  workflow_call:
    inputs:
      profile:
        type: string
        default: release

permissions:
  contents: read

# Called from pr.yml, github.workflow here is pr.yml's name, so sharing its
# group would cancel this run; the event name keeps the two apart.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRITORY: USA
  VERSION: DEBUG

jobs:
  # data/CDData/Track1.Ixa is 133MB of Git LFS. checkout's lfs: true would
  # re-fetch it every run and drain the account's LFS bandwidth quota (1GiB
  # /month on the free tier); once that's gone, checkout AND plain cloning
  # fail for everyone until a data pack is bought. Cache the objects keyed
  # on their oids instead, so the 133MB is paid once and the key rotates
  # by itself if the asset ever changes.  This job fills the cache (a
  # minute or two); both data jobs need it and then restore a warm cache
  # side by side, so a cold cache - GitHub evicts one unused for 7 days,
  # and runs here are by hand - is still fetched once, not once per
  # territory.  Its three LFS steps are anchored for the data jobs.
  lfs:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - &lfs-ids
        name: Resolve LFS object ids
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - &lfs-cache
        uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - &lfs-pull
        name: Fetch LFS objects
        shell: bash
        run: git lfs pull

  # M0 data pipeline: BigLump.Bin + generated headers (BigLump.h, Sprites.h,
  # trans.h, ...) that gate both the PC and PSX configure/build steps. Runs
  # the vintage Win32 converter EXEs (tools/Data/bin, tools/psyq/bin) via
  # MSYS2 make/perl - no MinGW compiler needed here, just the base runtime.
  data:
    needs: lfs
    runs-on: windows-latest
    timeout-minutes: 20
    defaults: &msys2-defaults
      run:
        shell: msys2 {0}
    steps: &data-steps
      - uses: actions/checkout@v7

      # the lfs job's cache, restored: no download
      - *lfs-ids
      - *lfs-cache
      - *lfs-pull

      # Graphics/UI/+key*.bmp (what the data build packs) are generated from
      # the square-pixel masters in port/art/keycaps (PR #54); a master
      # edited without re-running the tool would ship stale caps.  Both sets
      # are LFS, so this comes after the pull.  Uses the runner's Python.
      - name: Keycaps in step with masters
        shell: bash
        run: python port/tools/stretch_keycaps.py --check

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: make perl
          cache: true

      - name: Build data (BigLump.Bin + generated headers)
        run: bash port/build-data.sh "$TERRITORY" "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: sbsp-data-${{ env.TERRITORY }}-${{ env.VERSION }}
          path: out/
          retention-days: 3

  # The same steps for EUR (issue #42): the job's TERRITORY overrides the
  # workflow's, so the build line and the artifact name follow it.  It runs
  # beside data, so neither territory's data build can hold up the other's.
  data-eur:
    if: inputs.profile != 'pr'
    needs: lfs
    runs-on: windows-latest
    timeout-minutes: 20
    defaults: *msys2-defaults
    env:
      TERRITORY: EUR
    steps: *data-steps

  # PC (Win32) port, the shipping MinGW build: configure+build via the
  # mingw32 CMake preset, then ctest's two labels - `unit` (the shim unit
  # exes + the headless link proof) and `playthrough` (the M8 harness:
  # exit-code self-test, fast Tier 1 routes, short Tier 2 sweep, all
  # --uncapped so they run faster than real time and deterministically).
  # sbsp.exe itself - the windowed game - is only ever driven headlessly.
  #
  # Both variants (issue #64): FINAL is the exe port/package.py ships as
  # sbsp.exe, and __VERSION_FINAL__ compiles the asserts out, so a variable
  # used only inside an ASSERT breaks FINAL alone.  One USA data build
  # serves both legs (the data is per territory, not per variant, #35).
  # The pr profile runs debug only; clang-cl's x64 FINAL leg covers FINAL.
  # pc-eur below runs these steps for EUR.
  pc-build-test:
    name: pc-build-test (${{ matrix.preset }})
    needs: data
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(inputs.profile == 'pr' && '["debug"]' || '["debug", "final"]') }}
    defaults: *msys2-defaults
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps: &pc-steps
      - uses: actions/checkout@v7

      # the unit test lznp_exe_matches_source compares the committed
      # port/tools/lznp.exe with the encoder built from its sources; it is an
      # LFS object (22 KB), a pointer without this, and the test fails on a
      # pointer.  Only that one file - the 133MB track stays with the data job.
      - name: Fetch lznp.exe (LFS)
        shell: bash
        run: git lfs pull --include port/tools/lznp.exe

      - uses: actions/download-artifact@v8
        with:
          name: sbsp-data-${{ env.TERRITORY }}-${{ env.VERSION }}
          path: out/

      # CMakePresets.json hardcodes C:/msys64/mingw32/bin/ninja.exe as
      # CMAKE_MAKE_PROGRAM, so location must match for cmake to find it.
      # windows-latest already has MSYS2 installed there - release: false
      # reuses it instead of trying (and failing) a fresh install over it.
      # python: the playthrough tier driver (port/tests/run_tier.py), found
      # by CMake's find_package(Python3) at configure time.
      - uses: msys2/setup-msys2@v2
        with:
          location: C:\
          release: false
          update: true
          msystem: MINGW32
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            mingw-w64-i686-vulkan-headers
            mingw-w64-i686-python
          cache: true

      # MSYS2 is retiring the deprecated 32-bit environment and dropped
      # mingw-w64-i686-sdl3 from the mingw32 index (242 i686 packages went
      # between 2026-06 and 2026-09; gcc/cmake/ninja survive). The package
      # file is still on the mirror, so pin it by URL - this also keeps CI
      # on the same SDL3 the local toolchain builds against. Its deps
      # (gcc-libs, libiconv, vulkan-loader) are still indexed.
      - name: Install SDL3 (no longer in the mingw32 index)
        run: |
          pacman -U --noconfirm \
            https://repo.msys2.org/mingw/mingw32/mingw-w64-i686-sdl3-3.4.10-1-any.pkg.tar.zst

      - name: Build PC port (${{ matrix.preset }})
        run: bash port/build-pc.sh ${{ matrix.preset }}

      - name: Unit tests
        # a data-dependent test that finds its input missing exits 1 here
        # instead of 77/skipped: CI staged the data, so a skip is a loss
        # (tests/test_skip.h, issue #61)
        env:
          SBSP_TEST_STRICT: 1
        run: ctest --test-dir port/build/${{ matrix.preset }} --output-on-failure -L unit --no-tests=error

      - name: Playthrough tiers (uncapped)
        run: ctest --test-dir port/build/${{ matrix.preset }} --output-on-failure -L playthrough --no-tests=error

      # every route/level run's stderr (the [scene]/[summary]/[assert] log
      # the oracle grepped), for triage when a tier fails; the name carries
      # the preset because artifact names must be unique within a run
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: tier-logs-mingw-${{ matrix.preset }}-${{ env.TERRITORY }}
          path: port/build/${{ matrix.preset }}/tier-logs/
          if-no-files-found: ignore
          retention-days: 7

  # The EUR pair (issue #42), the same steps on data-eur's artifact.  The
  # presets set SBSP_TERRITORY, so the tests and tiers run the EUR (PAL
  # 50Hz) game.
  pc-eur:
    name: pc-eur (${{ matrix.preset }})
    if: inputs.profile != 'pr'
    needs: data-eur
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: [eur-debug, eur-final]
    defaults: *msys2-defaults
    env:
      TERRITORY: EUR
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps: *pc-steps

  # The same port built by clang-cl (LLVM, i686-pc-windows-msvc) against the
  # MSVC CRT and Windows SDK - the toolchain that does not depend on MSYS2's
  # shrinking 32-bit repository, and the one Visual Studio debugs natively.
  # No MSYS2 here at all: the runner's cmake/ninja/python, LLVM under
  # C:\Program Files, Visual Studio's x86 build tools + SDK (VS 2026 under
  # C:\Program Files\Microsoft Visual Studio\18 on windows-latest since
  # 2026-09), and the SDL3 VC /
  # Vulkan-Headers packages port/cmake/deps_vc.cmake fetches.  A failure
  # here fails the run like any other job (issue #41 item 7): it was
  # advisory (continue-on-error) through the M8 PR 4 timebox, when its
  # green tick meant nothing, and making it count is one of #39's gates.
  #
  # One job definition, two targets (M9): i686-pc-windows-msvc, and the
  # same tree as a true 64-bit exe (SBSP_PC64 - 4-byte pointer fields kept
  # in the file-overlay structs, a 16-aligned heap).  A matrix rather than
  # two copies, so a change to the steps cannot land in one and miss the
  # other.  The x64 FINAL leg is the sbsp64.exe `port/package.py --x64`
  # ships (issue #64); `suffix` keeps the two older legs' check names as
  # they were.  The pr profile runs that x64 FINAL leg alone.  The legs are
  # picked whole by profile: an `exclude` would not do, because a matrix
  # adds back any `include` entry that matches no remaining leg.
  clangcl:
    name: clangcl (${{ matrix.triple }}${{ matrix.suffix }})
    needs: data
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.profile == 'pr' && '[
            {"preset": "clangcl-x64-final", "triple": "x86_64-pc-windows-msvc", "suffix": ", final"}
          ]' || '[
            {"preset": "clangcl-debug", "triple": "i686-pc-windows-msvc", "suffix": ""},
            {"preset": "clangcl-x64-debug", "triple": "x86_64-pc-windows-msvc", "suffix": ""},
            {"preset": "clangcl-x64-final", "triple": "x86_64-pc-windows-msvc", "suffix": ", final"}
          ]') }}
    defaults:
      run:
        shell: pwsh
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7

      # lznp_exe_matches_source needs the real lznp.exe (LFS), as in
      # pc-build-test
      - name: Fetch lznp.exe (LFS)
        shell: bash
        run: git lfs pull --include port/tools/lznp.exe

      - uses: actions/download-artifact@v8
        with:
          name: sbsp-data-${{ env.TERRITORY }}-${{ env.VERSION }}
          path: out/

      - name: Toolchain versions
        run: |
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version
          cmake --version
          ninja --version

      # the preset borrows MSYS2's ninja for local use; the runner has its
      # own on PATH
      - name: Configure (clang-cl, ${{ matrix.triple }})
        working-directory: port
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_MAKE_PROGRAM=ninja

      - name: Build
        working-directory: port
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Unit tests
        # a data-dependent test that finds its input missing exits 1 here
        # instead of 77/skipped: CI staged the data, so a skip is a loss
        # (tests/test_skip.h, issue #61)
        env:
          SBSP_TEST_STRICT: 1
        run: ctest --test-dir port/build/${{ matrix.preset }} --output-on-failure -L unit --no-tests=error

      - name: Playthrough tiers (uncapped)
        run: ctest --test-dir port/build/${{ matrix.preset }} --output-on-failure -L playthrough --no-tests=error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: tier-logs-${{ matrix.preset }}-${{ env.TERRITORY }}
          path: port/build/${{ matrix.preset }}/tier-logs/
          if-no-files-found: ignore
          retention-days: 7

  # Original PlayStation executable (Spongey.cpe), linked with the vintage
  # PSY-Q toolchain committed under tools/psyq/bin. No MinGW needed - just
  # MSYS2 base driving those 32-bit PE console tools directly. Only links
  # (`dirs link`); pressing a disc image needs 16-bit tools that cannot run
  # on 64-bit Windows at all, so that stays a local/manual step.
  psx-build:
    needs: data
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: sbsp-data-${{ env.TERRITORY }}-${{ env.VERSION }}
          path: out/

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: make perl
          cache: true

      - name: Build PSX executable (Spongey.cpe)
        run: bash port/build-psx.sh "$TERRITORY" "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: sbsp-psx-${{ env.TERRITORY }}-${{ env.VERSION }}
          path: out/${{ env.TERRITORY }}/${{ env.VERSION }}/version/CD/Spongey.cpe
          retention-days: 7
