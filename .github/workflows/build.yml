name: Build & test (release)

# Every job the port has, in two profiles:
#
#   release  the full set, started by hand before a release: the Actions
#            tab (Run workflow, pick the branch) or `gh workflow run
#            build.yml --ref <branch>`.  Ten jobs: lfs, USA and EUR data,
#            the x64 debug/final and eur-debug/eur-final legs, the x86
#            debug/final legs, the PlayStation link.
#   pr       what pr.yml calls on every pull request into SBSP-Win11: five
#            jobs - lfs, USA data, x64 debug (asserts on) and final (the
#            sbsp.exe port/package.py ships, asserts out), and the
#            PlayStation link.  EUR and the x86 legs wait for a release run.
#
# Every PC leg is clang-cl (issue #39 retired MinGW), and no job uses MSYS2
# (issue #98): the data, PC and PlayStation builds all run on the runner's
# CMake, Ninja and Python.
#
# One file for both so the two cannot drift apart (the YAML anchors below
# only reach within a file).  Pushes trigger nothing.  A run costs LFS
# bandwidth (the 133MB Track1.Ixa on a cold cache, see the lfs job) and
# runner time.  A pull request's run can restore its base branch's cache,
# so a release run on SBSP-Win11 spares each new pull request that fetch.
#
# EUR (issue #42): its own data job and PC legs, data-eur and pc-eur, which
# reuse the USA jobs' steps through YAML anchors (&data-steps, &pc-steps)
# so the two territories cannot drift apart.  They are separate jobs, not
# matrix legs of data / pc-build-test, because `needs` waits for every leg:
# an EUR failure must not hold up the USA jobs, nor the reverse.  Both data
# jobs need only the lfs job, which fetches the LFS objects into the cache
# once for both.  The EUR data failure #42 was filed for was Git Bash's
# native make cutting the parkgrab command line short; the data build has
# not used make since issue #95.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Which jobs to run
        type: choice
        options: [release, pr]
        default: release
  workflow_call:
    inputs:
      profile:
        type: string
        default: release

permissions:
  contents: read

# Called from pr.yml, github.workflow here is pr.yml's name, so sharing its
# group would cancel this run; the event name keeps the two apart.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRITORY: USA
  VERSION: DEBUG

jobs:
  # data/CDData/Track1.Ixa is 133MB of Git LFS. checkout's lfs: true would
  # re-fetch it every run and drain the account's LFS bandwidth quota (1GiB
  # /month on the free tier); once that's gone, checkout AND plain cloning
  # fail for everyone until a data pack is bought. Cache the objects keyed
  # on their oids instead, so the 133MB is paid once and the key rotates
  # by itself if the asset ever changes.  This job fills the cache (a
  # minute or two); both data jobs need it and then restore a warm cache
  # side by side, so a cold cache - GitHub evicts one unused for 7 days,
  # and runs here are by hand - is still fetched once, not once per
  # territory.  Its three LFS steps are anchored for the data jobs.
  lfs:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - &lfs-ids
        name: Resolve LFS object ids
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - &lfs-cache
        uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - &lfs-pull
        name: Fetch LFS objects
        shell: bash
        run: git lfs pull

  # M0 data pipeline: BigLump.Bin + generated headers (BigLump.h, Sprites.h,
  # trans.h, ...) that gate both the PC and PSX configure/build steps.  The
  # CMake + Ninja data project in port/data (issue #95) runs the committed x64
  # converter EXEs in port/tools/x64 (issue #48, LFS, fetched by the pull
  # below): no compiler and no MSYS2, just the runner's CMake, Ninja and
  # Python, which build_data.py finds on the PATH (issue #98).
  data:
    needs: lfs
    runs-on: windows-latest
    timeout-minutes: 20
    defaults: &data-defaults
      run:
        shell: cmd
    steps: &data-steps
      - uses: actions/checkout@v7

      # the lfs job's cache, restored: no download
      - *lfs-ids
      - *lfs-cache
      - *lfs-pull

      # Graphics/UI/+key*.bmp (what the data build packs) are generated from
      # the square-pixel masters in port/art/keycaps (PR #54); a master
      # edited without re-running the tool would ship stale caps.  Both sets
      # are LFS, so this comes after the pull.  Uses the runner's Python.
      - name: Keycaps in step with masters
        shell: bash
        run: python port/tools/stretch_keycaps.py --check

      - name: Build data (BigLump.Bin + generated headers)
        run: port\build-data.cmd %TERRITORY%

      - uses: actions/upload-artifact@v7
        with:
          name: sbsp-data-${{ env.TERRITORY }}-${{ env.VERSION }}
          path: out/
          retention-days: 3

  # The same steps for EUR (issue #42): the job's TERRITORY overrides the
  # workflow's, so the build line and the artifact name follow it.  It runs
  # beside data, so neither territory's data build can hold up the other's.
  data-eur:
    if: inputs.profile != 'pr'
    needs: lfs
    runs-on: windows-latest
    timeout-minutes: 20
    defaults: *data-defaults
    env:
      TERRITORY: EUR
    steps: *data-steps

  # The PC port, clang-cl (issue #39 made it the only toolchain): LLVM under
  # C:\Program Files, Visual Studio's MSVC build tools + Windows SDK (VS 2026
  # under C:\Program Files\Microsoft Visual Studio\18 on windows-latest since
  # 2026-09), the runner's CMake, Ninja and Python, and the SDL3 VC /
  # Vulkan-Headers packages port/cmake/deps_vc.cmake fetches - no MSYS2.
  # port/tools/build_pc.py configures and builds the preset, then ctest's two
  # labels: `unit` (the shim unit exes + the headless link proof) and
  # `playthrough` (the M8 harness: exit-code self-test, fast Tier 1 routes,
  # short Tier 2 sweep, all --uncapped so they run faster than real time and
  # deterministically).  sbsp.exe itself - the windowed game - is only ever
  # driven headlessly.
  #
  # debug and final are the x64 exes port/package.py ships (sbsp-debug.exe,
  # sbsp.exe).  __VERSION_FINAL__ compiles the asserts out, so a variable
  # used only inside an ASSERT breaks FINAL alone (issue #64): the pr profile
  # runs both.  The release profile adds x86-debug and x86-final, the 32-bit
  # builds parity64 holds x64 to.  One USA data build serves every leg (the
  # data is per territory, not per variant, #35).  pc-eur below runs these
  # steps for EUR.
  pc-build-test:
    name: pc-build-test (${{ matrix.preset }})
    needs: data
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(inputs.profile == 'pr' && '["debug", "final"]' || '["debug", "final", "x86-debug", "x86-final"]') }}
    defaults: &pc-defaults
      run:
        shell: pwsh
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps: &pc-steps
      - uses: actions/checkout@v7

      # the unit tests lznp_exe_matches_source and datatools_exe_matches_source
      # compare the committed port/tools/lznp.exe and port/tools/x64/*.exe
      # with the tools built from their sources; they are LFS objects (22 KB,
      # ~0.5 MB each), pointers without this, and the tests fail on a pointer.
      # Only those files - the 133MB track stays with the data job.
      - name: Fetch the rebuilt tools (LFS)
        shell: bash
        run: git lfs pull --include "port/tools/lznp.exe,port/tools/x64/*.exe"

      - uses: actions/download-artifact@v8
        with:
          name: sbsp-data-${{ env.TERRITORY }}-${{ env.VERSION }}
          path: out/

      - name: Toolchain versions
        run: |
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version
          cmake --version
          ninja --version
          python --version

      # build_pc.py takes CMake and Ninja from the PATH (port/tools/buildenv.py)
      # and configures with Python3_EXECUTABLE set to the runner's Python
      - name: Build PC port (${{ matrix.preset }})
        run: python port/tools/build_pc.py ${{ matrix.preset }}

      - name: Unit tests
        # a data-dependent test that finds its input missing exits 1 here
        # instead of 77/skipped: CI staged the data, so a skip is a loss
        # (tests/test_skip.h, issue #61)
        env:
          SBSP_TEST_STRICT: 1
        run: ctest --test-dir port/build/${{ matrix.preset }} --output-on-failure -L unit --no-tests=error

      - name: Playthrough tiers (uncapped)
        run: ctest --test-dir port/build/${{ matrix.preset }} --output-on-failure -L playthrough --no-tests=error

      # every route/level run's stderr (the [scene]/[summary]/[assert] log
      # the oracle grepped), for triage when a tier fails; the name carries
      # the preset because artifact names must be unique within a run
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: tier-logs-${{ matrix.preset }}-${{ env.TERRITORY }}
          path: port/build/${{ matrix.preset }}/tier-logs/
          if-no-files-found: ignore
          retention-days: 7

  # The EUR pair (issue #42), the same steps on data-eur's artifact.  The
  # presets set SBSP_TERRITORY, so the tests and tiers run the EUR (PAL
  # 50Hz) game.
  pc-eur:
    name: pc-eur (${{ matrix.preset }})
    if: inputs.profile != 'pr'
    needs: data-eur
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: [eur-debug, eur-final]
    defaults: *pc-defaults
    env:
      TERRITORY: EUR
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps: *pc-steps

  # Original PlayStation executable (Spongey.cpe), compiled and linked with
  # the vintage PSY-Q toolchain committed under tools/psyq/bin: 32-bit PE
  # console tools that port/psx's CMake + Ninja build drives directly, with
  # the runner's CMake, Ninja and Python - no MSYS2 (issue #98).  Only the
  # executable; pressing a disc image needs 16-bit tools that cannot run on
  # 64-bit Windows at all, so that stays a local/manual step.
  psx-build:
    needs: data
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: sbsp-data-${{ env.TERRITORY }}-${{ env.VERSION }}
          path: out/

      - name: Build PSX executable (Spongey.cpe)
        run: port\build-psx.cmd %TERRITORY% %VERSION%

      - uses: actions/upload-artifact@v7
        with:
          name: sbsp-psx-${{ env.TERRITORY }}-${{ env.VERSION }}
          path: out/${{ env.TERRITORY }}/${{ env.VERSION }}/version/CD/Spongey.cpe
          retention-days: 7
