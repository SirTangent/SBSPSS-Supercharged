name: PR check

# The quick check every pull request into SBSP-Win11 gets: build.yml's pr
# profile, five jobs - lfs, USA data, MinGW debug, clang-cl x64 FINAL and
# the PlayStation link.  The full set (EUR, MinGW final, the clang-cl debug
# legs) is build.yml run by hand before a release.  A pull request that
# changes only documentation skips this.
on:
  pull_request:
    branches: [SBSP-Win11]
    paths-ignore:
      - '**/*.md'
      - 'Dox/**'
      - 'port/docs/**'

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/build.yml
    with:
      profile: pr
